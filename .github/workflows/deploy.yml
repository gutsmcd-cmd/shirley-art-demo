name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode text-uploaded images
        run: |
          set -e
          if ls art-b64/part* >/dev/null 2>&1; then
            cat art-b64/part* | base64 -d | tar -xz
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git rm -r -q art-b64 && git add art
            git commit -m "Decode uploaded images" && git push origin HEAD:main
          fi
      - name: Publish to gh-pages
        run: |
          set -e
          mkdir /tmp/site && cp -r index.html style.css app.js art.json art robots.txt /tmp/site/ && cd /tmp/site && touch .nojekyll
          git init -q -b gh-pages && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898333+github-actions[bot]@users.noreply.github.com" commit -q -m "Publish $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages:gh-pages
